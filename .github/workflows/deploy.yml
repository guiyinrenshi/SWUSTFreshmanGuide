# 部署 VitePress 站点到 GitHub Pages
# 推送到 main 时自动构建并发布
# 站点地址: https://guiyinrenshi.github.io/SWUSTFreshmanGuide/

name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 授予 GITHUB_TOKEN 写权限,允许部署到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 避免旧版 Actions Runner 取消正在运行的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史,让最后更新时间能显示
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vitepress build docs
        env:
          # 自定义 base 时需要;这里保持默认 /SWUSTFreshmanGuide/
          NODE_OPTIONS: --max-old-space-size=4096
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
